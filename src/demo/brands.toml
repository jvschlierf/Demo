# Brands tracked by the morning report.
# sector: "luxury" or "sportswear". ticker may be omitted for private companies.
# aliases: sub-brands and key people; matched case-insensitively on word boundaries.
# Every brand also gets a Claude web search each morning; set scout = false to skip one.
# Qualify ambiguous names ("Coach handbag", not "Coach"): aliases are also Google News search terms.

# --- Luxury -----------------------------------------------------------------

[[brand]]
name = "LVMH"
sector = "luxury"
ticker = "MC.PA"
aliases = ["Louis Vuitton", "Dior", "Tiffany & Co", "Moët Hennessy", "Bernard Arnault"]

